[project]
name = "vaad-vivaad"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "django (>=6.0.4,<7.0.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "daphne (>=4.2.1,<5.0.0)",
    "psycopg[binary,pool] (>=3.2.0,<4.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "django-unfold (>=0.90.0,<0.91.0)",
    "whitenoise (>=6.0,<7.0)",
    "anthropic (>=0.40.0)",
    "channels (>=4.0.0)",
    "watchfiles (>=1.1.1,<2.0.0)",
    "uvicorn[standard] (>=0.49.0,<0.50.0)",
    "websocket (>=0.2.1,<0.3.0)",
    "celery (>=5.6.3,<6.0.0)",
    "kombu (>=5.6.2,<6.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "firebase-admin (>=7.4.0,<8.0.0)",
    "praw (>=7.7,<8.0)",
    "trafilatura (>=2.0,<3.0)",
    "websockets (>=16.0,<17.0)",
    "channels-redis (>=4.3.0,<5.0.0)",
    "pre-commit (>=4.6.0,<5.0.0)",
    "ruff (>=0.15.20,<0.16.0)",
    "openai (>=3.8.0,<4.0.0)"
]


[tool.ruff]
target-version = "py313"
exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
# E9 = syntax errors, F = pyflakes (unused imports F401, unused vars F841, undefined names F821)
select = ["E9", "F"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
